# The roadmap gate (tasks 0.7 and 2.4), running the two scripts copied from
# posture-sec/stellar-account-fixtures rather than importing them (D-04).
#
# Two failures it has to catch, both of which have happened in this org on hand-maintained
# tables: a pull request that changes files and leaves ROADMAP.md alone, and a pull request
# that edits the checklist while leaving the derived progress table or the Last updated line
# behind. The table is generated by scripts/roadmap_progress.py, so a row that disagrees with
# the task lines is a row nobody regenerated.
#
# The same rule cuts against this repository: a gate that is not itself tested is a gate nobody
# knows the shape of. tests/test_roadmap_gate.py runs both scripts as subprocesses over a
# temporary repository, and `ci / python` executes that suite, so a regression in a copied
# guard fails a check that is required to merge.
#
# Gate G1 is not this workflow existing. It is the observed run on GitHub, recorded with its
# date in ROADMAP.md, and 2.7 is the task that makes it required rather than merely present.

name: roadmap-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  roadmap:
    name: roadmap-check / gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull_request checkout is detached at the merge ref with no base branch, so the
          # gate would have nothing to diff against. Depth 0 fetches every branch, which is
          # what puts origin/<base> in the repository this step reads.
          fetch-depth: 0

      - name: ROADMAP.md touched in the same change
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        # No fetch here on purpose. `fetch-depth: 0` above already named every branch, and a
        # gate that needs to authenticate is a gate that needs the runner's credential left
        # in place. Observed 2026-11-04: the extra `git fetch` in this step was refused with
        # "could not read Username", because `persist-credentials: false` had already taken
        # the credential away. The redundant fetch was the only thing that could fail.
        run: scripts/check_roadmap_touched.sh "origin/${GITHUB_BASE_REF}"

      - name: Progress table agrees with the task lines
        run: python3 scripts/roadmap_progress.py --check ROADMAP.md

      - name: README metrics and badge endpoints are synchronized
        run: python3 scripts/sync_readme.py --check
